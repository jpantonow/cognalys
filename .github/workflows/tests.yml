# The unit suite on every push and pull request, in the environment
# requirements.lock pins.
#
# This is deliberately not a gate on pipeline runs: a run checks only the
# code it is about to execute (utils/preflight.py). The suite belongs here,
# where it catches a regression before it reaches a run at all.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # javac/javap are used by a few tests; they skip without them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      # The executable oracle for specifications with a rule in
      # data/detector_rules/semgrep; the same version the rules were
      # validated with. Its tests skip without it.
      - name: Install semgrep
        run: python -m pip install semgrep==1.172.0
      - name: Configure git for tests that commit
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
