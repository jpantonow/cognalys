# The allow-list violation is locally and safely detectable when the reported 
# method contains a direct MessageDigest.getInstance call whose algorithm is a
#  string literal other than SHA-256, SHA-384, or SHA-512. Replacing that lite
# ral with an allowed literal silences the finding. The rule intentionally doe
# s not report variable/configuration-derived algorithms, delegated factories,
#  dependency-injected MessageDigest instances, protocol ordering, or array-ra
# nge predicates: those either cannot be decided reliably from the factory exp
# ression or are not safely expressible as a local syntactic oracle. In partic
# ular, a caller such as getFingerprint(context, "SHA1") has no locally visibl
# e MessageDigest factory and is not matched.
# Detect a locally visible literal violation of MessageDigestSpec's factory
# allow-list.  The embedded string metavariable only matches a string literal;
# variable/configuration-derived algorithms are intentionally outside this
# local rule because their allowed value set is not established by this call.
rules:
  - id: message-digest-non-allowlisted-literal-algorithm
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      checks: [ALG]
    message: MessageDigest algorithm literal is not SHA-256, SHA-384, or SHA-512
    patterns:
      - pattern-either:
          - pattern: 'MessageDigest.getInstance("$ALG")'
          - pattern: 'MessageDigest.getInstance("$ALG", $PROVIDER)'
          - pattern: 'java.security.MessageDigest.getInstance("$ALG")'
          - pattern: 'java.security.MessageDigest.getInstance("$ALG", $PROVIDER)'
      - metavariable-regex:
          metavariable: $ALG
          # $ALG is the contents of the matched string literal.
          regex: '^(?!(?:SHA-256|SHA-384|SHA-512)$)[\s\S]*$'

