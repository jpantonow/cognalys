# Key material that is a constant of the program: a string literal's bytes
# or a byte-array literal handed to SecretKeySpec. Anyone with the APK has
# the key. Repaired where the key is made: generate it (KeyGenerator), keep
# it in the Android Keystore, or derive it from a user secret.
rules:
  - id: secret-key-from-constant
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      checks: [CONSTR, NOBS]
    message: SecretKeySpec key material is a constant in the code
    pattern-either:
      - pattern: new SecretKeySpec("$K".getBytes(...), ...)
      - pattern: new SecretKeySpec(new byte[] {...}, ...)
      - pattern: SecretKeySpec("$K".toByteArray(...), ...)
      - pattern: SecretKeySpec(byteArrayOf(...), ...)
