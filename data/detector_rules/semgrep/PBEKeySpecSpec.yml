# PBKDF key derivation with a literal iteration count under 10,000, which
# makes guessing the password cheap (OWASP recommends hundreds of
# thousands for PBKDF2). Repaired in the call: a higher count. A count
# that names stored data needs a migration for existing values, which the
# repair gates check (contract_gates.changed_stored_derivations).
rules:
  - id: pbe-few-iterations
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      checks: [CONSTR]
    message: PBKDF iteration count under 10000
    patterns:
      - pattern-either:
          - pattern: new PBEKeySpec($P, $S, $N, $L)
          - pattern: new PBEKeySpec($P, $S, $N)
          - pattern: PBEKeySpec($P, $S, $N, $L)
          - pattern: PBEKeySpec($P, $S, $N)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10000
