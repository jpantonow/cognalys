[pytest]
# Without this, a bare `pytest` at the repository root walks outputs/ --
# hundreds of megabytes of clones and worktrees -- looking for tests, and
# under WSL every one of those stats crosses to the Windows filesystem:
# collection alone ran for over twenty minutes.
testpaths = tests
norecursedirs = outputs build built_apks_no_proguard finding_worktrees data evals artigo_tcc_latex .git __pycache__
